<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multiplication Facts: Fixed × n</title>
  <style>
    :root {
      --border:#ddd;
      --ink:#111;
      --ok:#2e7d32;
      --bad:#c62828;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
      color: var(--ink);
      margin: 0;
      padding: 24px;
    }
    #container { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 8px; }
    .subhead {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px 16px;
      align-items: center;
      margin-bottom: 12px;
    }
    .subhead label { font-size: 14px; white-space: nowrap; }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px;
      margin: 12px 0 16px;
    }
    .controls > label {
      display: flex; flex-direction: column; gap: 4px; font-size: 14px;
    }
    select, input[type="number"], input[type="text"] {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }
    .buttons {
      display:flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px;
    }
    button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: #fafafa;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #f1f1f1; }

    #questions {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
      counter-reset: qnum;
    }
    .question {
      width: 10.5%;
      min-width: 115px;
      border: 1px solid var(--border);
      padding: 10px 10px 12px;
      display: flex; flex-direction: column; align-items: flex-end;
      font-size: 18px;
      position: relative;
    }
    .qnum::before {
      counter-increment: qnum;
      content: counter(qnum) ".";
      position: absolute; left: 8px; top: 6px; font-size: 12px; opacity: .6;
    }
    .operation { display: flex; align-items: center; gap: 6px; }
    .equals-line { border-bottom: 1px solid #000; width: 100%; margin: 2px 0; }
    input.user-answer {
      width: 100%;
      font-family: inherit;
      font-size: 22px;
      text-align: right;
      border: none; outline: none;
    }
    input.user-answer::-webkit-inner-spin-button { display: none; }
    .result { font-size: 18px; margin-top: 4px; display:none; }
    .result.ok { color: var(--ok); }
    .result.bad { color: var(--bad); }

    .answer-key {
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display:none;
      font-size: 14px;
      columns: 3 250px;
      column-gap: 24px;
    }
    .answer-key h3 { margin: 0 0 8px; break-inside: avoid; }
    .answer-key ul { margin: 0 0 12px; padding-left: 18px; break-inside: avoid; }
    .meta { display:flex; gap:16px; align-items:center; }
    .meta input[type="text"] { width: 220px; }

    /* Print styles */
    @media print {
      .controls, .buttons, .subhead, .answer-toggle { display: none !important; }
      body { padding: 0; }
      #container { max-width: 100%; margin: 0 24px; }
      .question { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>Multiplication Facts: Fixed × n</h1>
    <div class="subhead">
      <div class="meta">
        <label>Student: <input id="studentName" type="text" placeholder="Name"></label>
        <label>Date: <input id="dateField" type="text" placeholder="MM/DD/YYYY"></label>
      </div>
      <label class="answer-toggle"><input type="checkbox" id="toggleKey"> Show Answer Key</label>
      <div style="text-align:right; font-size:12px; opacity:.75;">Seed: <span id="seedDisplay">—</span></div>
    </div>

    <div class="controls" aria-label="Worksheet settings">
      <label>Fixed Number (multiplicand)
        <input id="fixedNum" type="number" value="3" min="-9999" max="9999" step="1">
      </label>
      <label>Max Other Factor (0…max)
        <input id="maxOther" type="number" value="12" min="0" max="9999" step="1">
      </label>
      <label>Problems
        <input id="count" type="number" value="48" min="6" max="120" step="6">
      </label>
      <label>Sampling
        <select id="sampling">
          <option value="shuffle" selected>Shuffle 0…max (no repeats if enough)</option>
          <option value="random">Random (with replacement)</option>
        </select>
      </label>
      <label>Order
        <select id="orderMode">
          <option value="as-picked" selected>As picked</option>
          <option value="ascending">Sort by factor ↑</option>
          <option value="descending">Sort by factor ↓</option>
        </select>
      </label>
      <label>Seed (optional)
        <input id="seed" type="number" placeholder="e.g., 12345" min="0">
      </label>
    </div>

    <div class="buttons">
      <button id="generateBtn">Generate</button>
      <button id="checkBtn">Check Answers</button>
      <button id="clearBtn">Clear Answers</button>
      <button id="printBtn">Print</button>
    </div>

    <div id="questions" role="list"></div>

    <div class="answer-key" id="answerKey">
      <h3>Answer Key</h3>
      <ul id="keyList"></ul>
    </div>
  </div>

  <script>
    // ===== Seeded PRNG (Mulberry32) =====
    function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
    function makeRngFromSeed(seed){ if(seed==null||isNaN(seed)) return Math.random; return mulberry32(Number(seed)>>>0); }
    function randint(rng,min,max){ return Math.floor(rng()*(max-min+1))+min; }

    // ===== DOM =====
    const qs = s=>document.querySelector(s);
    const questionsEl = qs("#questions");
    const generateBtn = qs("#generateBtn");
    const printBtn = qs("#printBtn");
    const checkBtn = qs("#checkBtn");
    const clearBtn = qs("#clearBtn");
    const toggleKey = qs("#toggleKey");
    const keyList = qs("#keyList");
    const answerKey = qs("#answerKey");
    const seedDisplay = qs("#seedDisplay");

    const fixedEl = qs("#fixedNum");
    const maxOtherEl = qs("#maxOther");
    const countEl = qs("#count");
    const samplingEl = qs("#sampling");
    const orderEl = qs("#orderMode");
    const seedInput = qs("#seed");

    // ===== Factor picking =====
    function pickFactors(rng, maxOther, count, mode){
      const pool = Array.from({length:maxOther+1}, (_,i)=>i); // 0..maxOther
      if(mode==="random"){
        const out=[]; for(let i=0;i<count;i++) out.push(randint(rng,0,maxOther));
        return out;
      } else {
        // shuffle (Fisher–Yates)
        for(let i=pool.length-1;i>0;i--){
          const j = Math.floor(rng()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]];
        }
        if(pool.length>=count) return pool.slice(0,count);
        // not enough unique values: fill remainder randomly
        const out = pool.slice();
        for(let i=pool.length;i<count;i++) out.push(randint(rng,0,maxOther));
        return out;
      }
    }

    function orderFactors(factors, mode){
      if(mode==="ascending") return [...factors].sort((a,b)=>a-b);
      if(mode==="descending") return [...factors].sort((a,b)=>b-a);
      return factors;
    }

    // ===== Rendering =====
    function formatQuestionHTML(idx, a, b, ans){
      const id = `q${idx}`;
      return `
        <div class="question qnum" role="listitem" data-answer="${ans}" aria-labelledby="${id}">
          <div id="${id}" class="sr-only" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Problem ${idx+1}</div>
          <div>${a}</div>
          <div class="operation">×&nbsp;${b}</div>
          <div class="equals-line"></div>
          <input type="number" class="user-answer" inputmode="numeric"/>
          <div class="result" aria-live="polite"></div>
        </div>
      `;
    }

    function generateWorksheet(){
      // inputs
      let fixed = parseInt(fixedEl.value);
      let maxOther = Math.max(0, parseInt(maxOtherEl.value));
      let count = Math.max(6, Math.min(120, parseInt(countEl.value)||48));
      if(isNaN(fixed)) fixed = 3;
      if(isNaN(maxOther)) maxOther = 12;

      const seed = seedInput.value ? Number(seedInput.value) : Math.floor(Math.random()*1e9);
      const rng = makeRngFromSeed(seed);
      seedDisplay.textContent = String(seed);

      // pick + order factors
      const raw = pickFactors(rng, maxOther, count, samplingEl.value);
      const factors = orderFactors(raw, orderEl.value);

      // render
      questionsEl.innerHTML = "";
      keyList.innerHTML = "";

      factors.forEach((n, i)=>{
        const ans = fixed * n;
        questionsEl.insertAdjacentHTML("beforeend", formatQuestionHTML(i, fixed, n, ans));
        keyList.insertAdjacentHTML("beforeend", `<li>${fixed} × ${n} = <strong>${ans}</strong></li>`);
      });

      // reset results + key visibility
      document.querySelectorAll(".result").forEach(r=>{ r.style.display="none"; r.className="result"; r.textContent=""; });
      answerKey.style.display = toggleKey.checked ? "block" : "none";
    }

    function checkAnswers(){
      document.querySelectorAll(".question").forEach(q=>{
        const correct = Number(q.getAttribute("data-answer"));
        const input = q.querySelector(".user-answer");
        const result = q.querySelector(".result");
        const val = Number(input.value);
        if(Number.isFinite(val) && val===correct){
          result.textContent = "✓"; result.className="result ok";
        } else {
          result.textContent = "✗"; result.className="result bad";
        }
        result.style.display="block";
      });
    }

    function clearAnswers(){
      document.querySelectorAll(".user-answer").forEach(i=>i.value="");
      document.querySelectorAll(".result").forEach(r=>{ r.style.display="none"; r.className="result"; r.textContent=""; });
    }

    // Events
    generateBtn.addEventListener("click", generateWorksheet);
    printBtn.addEventListener("click", ()=>window.print());
    checkBtn.addEventListener("click", checkAnswers);
    clearBtn.addEventListener("click", clearAnswers);
    toggleKey.addEventListener("change", ()=>{ answerKey.style.display = toggleKey.checked ? "block" : "none"; });

    // Initial render
    generateWorksheet();
  </script>
</body>
</html>
